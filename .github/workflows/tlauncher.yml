name: Tlauncher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: tlauncher.exe
            asset: tlauncher.exe
          - os: ubuntu-22.04
            file: tlauncher
            asset: tlauncher-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: launcher
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - run: cargo build --release --locked
      - run: mv target/release/${{ matrix.file }} ${{ matrix.asset }}
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: launcher/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - run: |
          version=$(grep -m1 '^version' launcher/Cargo.toml | cut -d'"' -f2)
          gh release create "v$version" dist/tlauncher.exe dist/tlauncher-linux --title "Tlauncher $version" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
