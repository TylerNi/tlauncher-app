[package]
name = "tlauncher"
version = "1.0.4"
edition = "2024"

[dependencies]
aes = "0.9.4"
ctr = "0.10.1"
egui = { version = "0.34", default-features = false }
egui_software_backend = "0.0.3"
epaint_default_fonts = "0.34.3"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shell-words = "1.1.1"
ureq = { version = "3.5.2", features = ["json"] }

[target."cfg(windows)".dependencies]
rfd = { version = "0.18.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.aes]
opt-level = 3

[profile.release.package.ctr]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3
